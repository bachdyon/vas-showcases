model = "whisper-1"
text = "Lỡ không làm được thì sao? Ai trong chúng ta cũng từng hỏi bản thân câu này ít nhất một lần trong đời. Nhưng bây giờ để mình hỏi bạn nè: lỡ bạn làm được thì sao? Nỗi sợ thất bại là điều mà ai cũng có, bạn có, mình cũng có. Và cách mà bạn có thể vượt qua nỗi sợ đó để bắt đầu hành động là hỏi bản thân câu hỏi này: nếu bạn làm cái này thì điều tồi tệ nhất có thể xảy ra là gì? Và nếu bạn chấp nhận được kết quả tệ nhất đó thì cứ làm đi. Ví dụ là mình muốn viết bài luận xin học bổng để giúp cho gia đình mình chi trả một phần chi phí du học. Lúc đầu mình nghĩ là khả năng mình trượt cao nhiều hơn khả năng đậu. Cho nên là mình cũng do dự không muốn làm. Nhưng nghĩ lại thì điều tồi tệ nhất có thể xảy ra là mình trượt cái học bổng đó và tốn một ít thời gian. Còn nếu đậu thì mình sẽ có vài ngàn đô để trả bớt chi phí đi học. Thế là mình quyết định làm và kết quả là mình nhận được một cái học bổng hai ngàn đô. Cho nên thất bại thì ai cũng sợ đó, nhưng mà đừng để nó ngăn cản bạn hành động nha."

