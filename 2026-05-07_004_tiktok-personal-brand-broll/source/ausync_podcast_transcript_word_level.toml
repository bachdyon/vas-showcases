text = "Lỡ không làm được thì sao? Chắc bạn cũng từng nghĩ vậy trước khi làm một việc mới. Sợ thất bại, sợ người khác đánh giá, sợ mất công. Thử đổi câu hỏi một chút lỡ mình làm được thì sao, rồi tự trả lời thẳng. Nếu mình làm thử, điều xấu nhất có thể xảy ra là gì? Mình có chấp nhận được không? Nếu chấp nhận được thì cứ làm. Còn nếu không chấp nhận được thì mình biết, mình đang sợ cái gì để xử lý đúng chỗ. Không sợ nỗi sợ hão huyền. Ví dụ đơn giản, bạn muốn nhắn xin lỗi hay hỏi tăng lương nhưng sợ bị từ chối. Xấu nhất có khi chỉ là họ nói không, hoặc hơi khó chịu một lúc, còn nếu không hỏi thì chắc chắn không đổi. Hoặc bạn muốn thử một việc phụ xấu nhất là mất chút thời gian, được thì lại có thêm kinh nghiệm hoặc thu nhập. Tóm lại, ai cũng ngại thất bại. Nhưng sự khác nhau giữa người đứng yên và người bước tiếp là một người để nỗi sợ quyết định thay mình, còn một người nhìn thẳng vào nó rồi vẫn chọn làm điều xứng đáng."

